
# =============================================================================
# File        : charts/tasktracker/templates/frontend-deploy.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.3.2, 4.3.3 - Sync waves and health checks
# Purpose     : Deploys the frontend in sync wave 2 with NodePort access
#               and an Nginx reverse proxy for backend API requests.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend-deployment
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  replicas: {{ .Values.frontend.replicaCount }}
  progressDeadlineSeconds: 120

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      tier: frontend
      app.kubernetes.io/name: {{ .Chart.Name }}

  template:
    metadata:
      labels:
        tier: frontend
        app.kubernetes.io/name: {{ .Chart.Name }}

      annotations:
        # Restart the frontend when application configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

        # Restart the frontend when the Nginx proxy configuration changes.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend-nginx-config.yaml") . | sha256sum }}

    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.targetPort }}

          # Application configuration.
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-frontend-config

          # Mount the custom Nginx configuration for API proxying.
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

      # Custom Nginx configuration supplied through a ConfigMap.
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Release.Name }}-frontend-nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend-service
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    tier: frontend
    app.kubernetes.io/name: {{ .Chart.Name }}

  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- if eq .Values.frontend.service.type "NodePort" }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
