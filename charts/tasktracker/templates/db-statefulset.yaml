# =============================================================================
# File        : charts/tasktracker/templates/db-statefulset.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit II 2.1.5, Unit IV 4.3.2
# Purpose     : Deploys PostgreSQL with persistent storage in sync wave 0.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db-service
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    tier: database
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - name: postgres
      port: {{ .Values.database.service.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: {{ .Release.Name }}-db-service
  replicas: {{ .Values.database.replicaCount }}
  podManagementPolicy: OrderedReady

  selector:
    matchLabels:
      tier: database
      app.kubernetes.io/name: {{ .Chart.Name }}

  template:
    metadata:
      labels:
        tier: database
        app.kubernetes.io/name: {{ .Chart.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}

          ports:
            - name: postgres
              containerPort: {{ .Values.database.service.port }}

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-database-config

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: POSTGRES_PASSWORD

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  updateStrategy:
    type: RollingUpdate
