# =============================================================================
# File        : charts/tasktracker/templates/configmap.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - Configurable Helm templates
# Purpose     : Stores non-sensitive application configuration.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-database-config
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  {{- range $key, $value := .Values.database.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend-config
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  DB_HOST: "{{ .Release.Name }}-db-0.{{ .Release.Name }}-db-service"
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-config
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  BACKEND_URL: "."
  {{- range $key, $value := .Values.frontend.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
