# =============================================================================
# File        : platform/staging/rbac.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit II 2.3 - Kubernetes RBAC
# Purpose     : Provides namespace-scoped read-only workload access.
# Note        : Recreated because the original A2 RBAC files were unavailable.
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tasktracker-reader
  namespace: dso202-staging
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - events
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tasktracker-reader-binding
  namespace: dso202-staging
subjects:
  - kind: User
    name: tasktracker-reader
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: tasktracker-reader
  apiGroup: rbac.authorization.k8s.io
