# =============================================================================
# File        : platform/staging/tasktracker-credentials.sealed.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV - GitOps secret management
# Purpose     : Encrypted Task Tracker credentials for the staging environment.
#               Generated using kubeseal against the cluster controller.
#               Uses strict scope for namespace dso202-staging.
#               Contains ciphertext only and is safe to commit to Git.
# =============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tasktracker-credentials
  namespace: dso202-staging
spec:
  encryptedData:
    DB_PASSWORD: 
    DB_USER: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: tasktracker-credentials
      namespace: dso202-staging
