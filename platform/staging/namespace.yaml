# =============================================================================
# File        : platform/staging/namespace.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.5.1 - namespaces; Unit IV 4.3.2 - sync options
# Purpose     : The staging namespace, owned by the platform-staging Application.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: dso202-staging
  labels:
    dso202/assignment: "04"
    dso202/environment: staging
    dso202/managed-by: argocd
  annotations:
    # Protect the namespace from automatic Argo CD pruning.
    argocd.argoproj.io/sync-options: Prune=false
