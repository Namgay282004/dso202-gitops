# File        : platform/dev/quota-and-limits.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.5.3 - Resource quotas and limits
# Purpose     : Reuses Assignment 2 resource restrictions.

# Resource restrictions inherited from Assignment 2.
# Assignment 4 initially uses one replica per tier.
# The quota provides headroom for rollouts and smoke tests.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mem-cpu-quota
  namespace: dso202-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mem-cpu-limits
  namespace: dso202-dev
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      type: Container
